
[versions]
vertx = "5.2.3"
junit-jupiter = "6.0.1"
checkstyle = "10.24.0"
spotbugs = "6.5.13"
jacoco = "0.8.15"
testcontainers = "2.0.5"
flyway = "13.13.0"
postgresql = "42.7.14"

[libraries]
vertx-core = { module = "io.vertx:vertx-core", version.ref = "vertx" }
vertx-web = { module = "io.vertx:vertx-web", version.ref = "vertx" }
vertx-pg-client = { module = "io.vertx:vertx-pg-client", version.ref = "vertx" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-jupiter" }

testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

postgresql-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

[plugins]
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }